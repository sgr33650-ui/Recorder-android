name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          cp app/build/outputs/apk/complet/release/app-complet-release.apk AppelsRec.apk
          cp app/build/outputs/apk/essai/release/app-essai-release.apk TestInstall.apk

      - name: Vérifier l'APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose AppelsRec.apk
          $BT/aapt2 dump badging AppelsRec.apk | head -20
          $BT/apksigner verify TestInstall.apk
          $BT/aapt2 dump permissions TestInstall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppelsRec
          path: |
            AppelsRec.apk
            TestInstall.apk

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version AppelsRec.apk TestInstall.apk \
            --title "Dernière version" \
            --notes "APK compilé automatiquement depuis ${GITHUB_SHA::7}."
